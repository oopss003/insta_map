<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>INWAVE 카드뉴스 스튜디오</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Gowun+Dodum&family=Nanum+Gothic:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap');
*{box-sizing:border-box}
:root{--navy:#17243d;--navy2:#263957;--orange:#f58220;--ivory:#f5f1e8;--paper:#fffdf8;--muted:#697386;--line:#e3ddd2;--green:#176b3a}
body{margin:0;background:var(--ivory);font-family:"Noto Sans KR",Arial,sans-serif;color:var(--navy)}
header{background:var(--navy);color:#fff;padding:22px 28px}
header h1{margin:0;font-size:24px} header p{margin:7px 0 0;color:#d9d4c8;font-size:14px}
main{width:min(1500px,calc(100% - 28px));margin:24px auto;display:grid;grid-template-columns:minmax(420px,640px) 1fr;gap:20px;align-items:start}
.panel{background:white;border-radius:18px;padding:22px;box-shadow:0 8px 28px rgba(23,36,61,.08)}
.sticky{position:sticky;top:18px}
h2{margin:0 0 14px;font-size:21px} h3{margin:0 0 10px}
.section{margin-top:24px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-weight:800;font-size:13px;margin-bottom:6px}
input,textarea,select{width:100%;border:1px solid #d8d3ca;border-radius:10px;padding:12px;background:#fff;color:var(--navy);font-size:14px}
textarea{resize:vertical;min-height:92px;line-height:1.55}
button{border:0;border-radius:10px;padding:13px 15px;font-weight:800;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{width:100%;background:var(--orange);color:white;margin-top:12px}
.btn-navy{background:var(--navy);color:white}.btn-green{background:var(--green);color:white}
.btn-soft{background:#eef1f5;color:var(--navy)}.btn-danger{background:#fff0ed;color:#a63a2c}
.status{margin-top:12px;padding:11px 12px;border-radius:10px;background:#eef1f5;font-size:13px;line-height:1.5}
.status.success{background:#eaf7ef;color:#176b3a}.status.error{background:#fff0f0;color:#b42318}
.plan-list{display:grid;gap:12px;margin-top:14px}
.plan-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fcfbf8}
.plan-card-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}
.badge{display:inline-flex;background:var(--navy);color:white;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}
.type-badge{background:#fff0df;color:#a84d00}
.card-actions{display:flex;gap:6px}
.card-actions button{padding:7px 9px;font-size:12px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
.field-row.three{grid-template-columns:1fr 1fr 1fr}
.inline-check{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700}
.inline-check input{width:auto}
.data-editor{font-family:Consolas,monospace;font-size:12px;min-height:110px}
.reason{margin-top:9px;padding:9px;border-left:4px solid var(--orange);background:#fff6ec;font-size:12px;line-height:1.5}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.toolbar button{flex:1;min-width:150px}
.preview-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.preview-card{background:#f7f5ef;border:1px solid var(--line);border-radius:14px;padding:10px}
.preview-card h4{margin:0 0 8px;display:flex;justify-content:space-between;font-size:13px}
canvas{width:100%;height:auto;aspect-ratio:4/5;background:#ddd;border-radius:10px;display:block}
.preview-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.preview-actions button{padding:9px;font-size:12px}
.empty{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed #ccc;border-radius:12px}
.help{font-size:12px;color:var(--muted);line-height:1.55;margin-top:8px}
.color-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.color-row input[type=color]{height:42px;padding:4px}
@media(max-width:1080px){main{grid-template-columns:1fr}.sticky{position:static}}
@media(max-width:720px){.grid2,.field-row,.field-row.three,.preview-grid,.color-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>INWAVE 카드뉴스 스튜디오</h1>
  <p>주제 입력 → AI가 3~5장 구조 판단 → 내용 검토 → 장별 자동 렌더링 → PNG·ZIP 저장</p>
</header>

<main>
<section class="panel">
  <h2>1. 카드뉴스 기획</h2>
  <label for="topic">메인 주제</label>
  <textarea id="topic" placeholder="예: 유동인구가 많으면 광고 효과도 높은지 광고주 관점에서 설명해줘."></textarea>

  <div class="section">
    <label for="facts">참고 데이터·반드시 포함할 내용</label>
    <textarea id="facts" placeholder="예: 오전 120명, 점심 280명, 저녁 460명. 숫자가 없으면 임의 수치를 만들지 않도록 합니다."></textarea>
  </div>

  <div class="grid2 section">
    <div>
      <label for="pageCount">장수</label>
      <select id="pageCount">
        <option value="auto">AI 자동</option>
        <option value="3">3장</option>
        <option value="4" selected>4장</option>
        <option value="5">5장</option>
      </select>
    </div>
    <div>
      <label for="labelMode">오렌지 라벨 방식</label>
      <select id="labelMode">
        <option value="ai" selected>AI가 장별 자동 생성</option>
        <option value="fixed">전체 고정 문구</option>
        <option value="hidden">전체 숨김</option>
      </select>
    </div>
  </div>

  <div class="section" id="fixedLabelWrap" style="display:none">
    <label for="fixedLabel">전체 고정 라벨</label>
    <input id="fixedLabel" value="광고 인사이트">
  </div>

  <button id="planBtn" class="btn-primary">AI 카드뉴스 기획</button>
  <div id="status" class="status">주제를 입력한 후 AI 카드뉴스 기획을 눌러주세요.</div>

  <div id="planSection" class="section" style="display:none">
    <h2>2. AI 기획 결과 검토</h2>
    <div class="help">AI가 먼저 결정하지만 제목, 본문, 라벨, 유형, 데이터는 모두 수정할 수 있습니다.</div>
    <div id="planList" class="plan-list"></div>
    <div class="toolbar">
      <button id="addPageBtn" class="btn-soft">장 추가</button>
      <button id="renderAllBtn" class="btn-navy">전체 장 렌더링</button>
    </div>
  </div>

  <div class="section">
    <h2>3. 전체 디자인 설정</h2>
    <div class="grid2">
      <div>
        <label for="fontFamily">폰트</label>
        <select id="fontFamily">
          <option value='"Noto Sans KR",sans-serif'>Noto Sans KR</option>
          <option value='"Nanum Gothic",sans-serif'>나눔고딕</option>
          <option value='"Black Han Sans",sans-serif'>검은고딕</option>
          <option value='"Do Hyeon",sans-serif'>도현체</option>
          <option value='"Gowun Dodum",sans-serif'>고운돋움</option>
        </select>
      </div>
      <div>
        <label for="coverOverlay">표지 어둡기</label>
        <input id="coverOverlay" type="range" min="20" max="90" value="58">
      </div>
    </div>
    <div class="color-row section">
      <div><label>네이비</label><input id="navyColor" type="color" value="#17243d"></div>
      <div><label>오렌지</label><input id="orangeColor" type="color" value="#f58220"></div>
      <div><label>아이보리</label><input id="ivoryColor" type="color" value="#f5f1e8"></div>
      <div><label>흰색</label><input id="whiteColor" type="color" value="#ffffff"></div>
    </div>
  </div>
</section>

<section class="panel sticky">
  <h2>4. 카드뉴스 미리보기</h2>
  <div id="previewGrid" class="preview-grid">
    <div class="empty">AI 기획 후 1~4장 전체가 여기에 표시됩니다.</div>
  </div>
  <div class="toolbar">
    <button id="downloadZipBtn" class="btn-green" disabled>전체 PNG ZIP 저장</button>
  </div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const LAYOUTS=["cover","explain","number","compare","table","bar-chart","line-chart","process","checklist","quote-insight","solution","cta"];
const ROLE_LABELS={cover:"표지",explain:"설명",number:"숫자",compare:"비교",table:"표", "bar-chart":"막대그래프","line-chart":"추이그래프",process:"과정",checklist:"체크리스트","quote-insight":"핵심문장",solution:"해결",cta:"마무리"};
const state={plan:null,images:{},canvases:{},rendered:false};

function setStatus(msg,type=""){const el=$("status");el.textContent=msg;el.className="status"+(type?" "+type:"")}
function safeJson(text,fallback={}){try{return JSON.parse(text||"{}")}catch{return fallback}}
function escapeHtml(s=""){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function clone(v){return JSON.parse(JSON.stringify(v))}
function colors(){return{navy:$("navyColor").value,orange:$("orangeColor").value,ivory:$("ivoryColor").value,white:$("whiteColor").value}}
function font(){return $("fontFamily").value}

$("labelMode").addEventListener("change",()=>{$("fixedLabelWrap").style.display=$("labelMode").value==="fixed"?"block":"none"});

function fallbackPlan(topic,facts,count,labelMode,fixedLabel){
 const n=count==="auto"?4:Number(count);
 const hasNums=/\d/.test(facts);
 const label=i=>labelMode==="hidden"?"":labelMode==="fixed"?fixedLabel:["광고 인사이트","왜 다를까요?","데이터로 보면","측정 포인트","한 줄 정리"][i]||"광고 인사이트";
 const pages=[
  {pageNumber:1,role:"hook",layoutType:"cover",label:label(0),showLabel:labelMode!=="hidden",title:topic.length>34?topic.slice(0,33)+"?":topic,body:"광고주가 놓치기 쉬운 차이를 다음 장에서 확인해보세요.",visualType:"photo",imageNeeded:true,imagePrompt:"현대적인 상업시설 디지털 사이니지 앞을 지나가는 사람들, 광고 현장, 세련된 다큐멘터리 사진, 세로 4:5, 텍스트 없음",dataJson:"{}",reason:"첫 장은 클릭과 넘김을 유도하는 표지형으로 구성했습니다."},
  {pageNumber:2,role:"problem",layoutType:"compare",label:label(1),showLabel:labelMode!=="hidden",title:"송출과 실제 시청은 다릅니다",body:"광고가 켜져 있었던 횟수와 사람이 실제로 본 횟수는 같은 지표가 아닙니다.",visualType:"comparison",imageNeeded:false,imagePrompt:"",dataJson:JSON.stringify({leftTitle:"송출 횟수",leftDescription:"광고가 재생된 횟수",rightTitle:"실제 시청",rightDescription:"사람이 광고에 관심을 보인 횟수"},null,2),reason:"두 개념의 차이가 핵심이므로 비교형을 선택했습니다."},
  hasNums?
  {pageNumber:3,role:"insight",layoutType:"bar-chart",label:label(2),showLabel:labelMode!=="hidden",title:"숫자로 보면 차이가 더 선명합니다",body:"제공된 데이터를 같은 기준으로 비교합니다.",visualType:"chart",imageNeeded:false,imagePrompt:"",dataJson:JSON.stringify({items:[{label:"오전",value:120},{label:"점심",value:280},{label:"저녁",value:460}],unit:"명"},null,2),reason:"사용자가 숫자를 제공했으므로 막대그래프형을 선택했습니다."}:
  {pageNumber:3,role:"insight",layoutType:"checklist",label:label(2),showLabel:labelMode!=="hidden",title:"좋은 광고 위치를 판단하는 기준",body:"유동인구 하나만으로는 실제 광고 성과를 설명하기 어렵습니다.",visualType:"checklist",imageNeeded:false,imagePrompt:"",dataJson:JSON.stringify({items:["실제 시청자 수","평균 시청시간","시간대별 관심도","위치별 성과 차이"]},null,2),reason:"실제 숫자가 없으므로 임의 그래프 대신 저장 가치가 있는 체크리스트형을 선택했습니다."},
  {pageNumber:4,role:"solution",layoutType:"solution",label:label(3),showLabel:labelMode!=="hidden",title:"광고도 시청 데이터로 운영해야 합니다",body:"실제 시청 데이터를 확인하면 위치와 소재를 근거 있게 비교할 수 있습니다.",visualType:"metric-cards",imageNeeded:false,imagePrompt:"",dataJson:JSON.stringify({metrics:["실제 시청자 수","평균 시청시간","시간대별 관심도","소재별 성과"]},null,2),reason:"후반부에서 INWAVE의 측정 가치를 광고주의 의사결정과 연결했습니다."},
  {pageNumber:5,role:"cta",layoutType:"cta",label:label(4),showLabel:labelMode!=="hidden",title:"송출된 광고보다 실제로 본 광고를 확인하세요",body:"운영 중인 광고 공간도 측정 가능한지 확인해보세요.",visualType:"text",imageNeeded:false,imagePrompt:"",dataJson:"{}",reason:"문의 유도가 필요한 경우에만 사용하는 마무리형입니다."}
 ];
 return {contentTitle:topic,pageCount:n,overallTone:"professional-insight",pages:pages.slice(0,n)};
}

$("planBtn").addEventListener("click",async()=>{
 const topic=$("topic").value.trim(); if(!topic){setStatus("메인 주제를 입력해 주세요.","error");return}
 const payload={topic,facts:$("facts").value.trim(),pageCount:$("pageCount").value,labelMode:$("labelMode").value,fixedLabel:$("fixedLabel").value.trim()};
 $("planBtn").disabled=true;setStatus("AI가 장수, 역할, 표·그래프·비교 여부를 판단하고 있습니다.");
 try{
  const r=await fetch("/api/plan-carousel",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
  const data=await r.json();
  if(!r.ok)throw new Error(data.error||"AI 기획 실패");
  state.plan=data;
  setStatus("AI 기획이 완료되었습니다. 내용을 검토한 뒤 전체 장 렌더링을 눌러주세요.","success");
 }catch(e){
  console.warn(e);
  state.plan=fallbackPlan(payload.topic,payload.facts,payload.pageCount,payload.labelMode,payload.fixedLabel);
  setStatus("AI 기획 API가 연결되지 않아 테스트용 규칙 기반 기획안을 표시했습니다. 화면과 렌더링 기능은 그대로 테스트할 수 있습니다.","error");
 }
 $("planBtn").disabled=false; renderPlanEditor(); renderAll();
});

function renderPlanEditor(){
 $("planSection").style.display="block";
 const wrap=$("planList");wrap.innerHTML="";
 state.plan.pages.forEach((p,i)=>{
  const card=document.createElement("div");card.className="plan-card";card.dataset.index=i;
  card.innerHTML=`
   <div class="plan-card-head">
    <div><span class="badge">${i+1}장</span> <span class="badge type-badge">${ROLE_LABELS[p.layoutType]||p.layoutType}</span></div>
    <div class="card-actions"><button class="btn-soft move-up">↑</button><button class="btn-soft move-down">↓</button><button class="btn-danger remove">삭제</button></div>
   </div>
   <div class="field-row three">
    <div><label>페이지 유형</label><select class="layout">${LAYOUTS.map(x=>`<option value="${x}" ${x===p.layoutType?"selected":""}>${ROLE_LABELS[x]}</option>`).join("")}</select></div>
    <div><label>역할</label><input class="role" value="${escapeHtml(p.role||"")}"></div>
    <div><label>시각 요소</label><input class="visual" value="${escapeHtml(p.visualType||"")}"></div>
   </div>
   <div class="field-row">
    <div><label>오렌지 라벨</label><input class="label" value="${escapeHtml(p.label||"")}"></div>
    <label class="inline-check" style="margin-top:26px"><input class="showLabel" type="checkbox" ${p.showLabel!==false?"checked":""}> 라벨 표시</label>
   </div>
   <div class="section"><label>제목</label><textarea class="title">${escapeHtml(p.title||"")}</textarea></div>
   <div class="section"><label>본문</label><textarea class="body">${escapeHtml(p.body||"")}</textarea></div>
   <div class="section"><label>표·그래프·비교 데이터(JSON)</label><textarea class="data-editor">${escapeHtml(p.dataJson||"{}")}</textarea></div>
   <div class="field-row">
    <label class="inline-check"><input class="imageNeeded" type="checkbox" ${p.imageNeeded?"checked":""}> AI 이미지 필요</label>
    <button class="btn-soft generate-image" ${p.imageNeeded?"":"disabled"}>이 장 이미지 1장 생성</button>
   </div>
   <div class="section"><label>이미지 프롬프트</label><textarea class="imagePrompt">${escapeHtml(p.imagePrompt||"")}</textarea></div>
   <div class="reason">${escapeHtml(p.reason||"")}</div>`;
  bindCard(card,i);wrap.appendChild(card);
 });
}

function syncCard(card,i){
 const p=state.plan.pages[i];
 p.layoutType=card.querySelector(".layout").value;
 p.role=card.querySelector(".role").value;
 p.visualType=card.querySelector(".visual").value;
 p.label=card.querySelector(".label").value;
 p.showLabel=card.querySelector(".showLabel").checked;
 p.title=card.querySelector(".title").value;
 p.body=card.querySelector(".body").value;
 p.dataJson=card.querySelector(".data-editor").value;
 p.imageNeeded=card.querySelector(".imageNeeded").checked;
 p.imagePrompt=card.querySelector(".imagePrompt").value;
}

function bindCard(card,i){
 card.querySelectorAll("input,textarea,select").forEach(el=>el.addEventListener("input",()=>{syncCard(card,i);renderPage(i)}));
 card.querySelector(".imageNeeded").addEventListener("change",e=>card.querySelector(".generate-image").disabled=!e.target.checked);
 card.querySelector(".remove").onclick=()=>{state.plan.pages.splice(i,1);renumber();renderPlanEditor();renderAll()};
 card.querySelector(".move-up").onclick=()=>{if(i>0){[state.plan.pages[i-1],state.plan.pages[i]]=[state.plan.pages[i],state.plan.pages[i-1]];renumber();renderPlanEditor();renderAll()}};
 card.querySelector(".move-down").onclick=()=>{if(i<state.plan.pages.length-1){[state.plan.pages[i+1],state.plan.pages[i]]=[state.plan.pages[i],state.plan.pages[i+1]];renumber();renderPlanEditor();renderAll()}};
 card.querySelector(".generate-image").onclick=()=>generatePageImage(i,card.querySelector(".generate-image"));
}
function renumber(){state.plan.pages.forEach((p,i)=>p.pageNumber=i+1);state.plan.pageCount=state.plan.pages.length}

$("addPageBtn").onclick=()=>{if(!state.plan)return;if(state.plan.pages.length>=5){setStatus("최대 5장까지 추가할 수 있습니다.","error");return}
 state.plan.pages.push({pageNumber:state.plan.pages.length+1,role:"cta",layoutType:"cta",label:"한 줄 정리",showLabel:true,title:"핵심 내용을 한 문장으로 정리하세요",body:"운영 중인 광고 공간도 측정 가능한지 확인해보세요.",visualType:"text",imageNeeded:false,imagePrompt:"",dataJson:"{}",reason:"사용자가 추가한 장입니다."});renumber();renderPlanEditor();renderAll()};

async function generatePageImage(i,btn){
 const p=state.plan.pages[i]; if(!p.imagePrompt.trim()){setStatus(`${i+1}장 이미지 프롬프트를 입력해 주세요.`,"error");return}
 btn.disabled=true;btn.textContent="생성 중...";
 try{
  const r=await fetch("/api/generate-images",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:p.imagePrompt,concept:"insight",providers:{fal:1,replicate:0,civitai:0}})});
  const data=await r.json();if(!r.ok)throw new Error(data.error||"이미지 생성 실패");
  const url=data.images?.[0]?.imageUrl;if(!url)throw new Error("생성된 이미지 URL이 없습니다.");
  state.images[i]=await loadImage(url);renderPage(i);setStatus(`${i+1}장 이미지가 생성되었습니다.`,"success");
 }catch(e){setStatus(e.message,"error")}
 btn.disabled=false;btn.textContent="이 장 이미지 1장 생성";
}
function loadImage(url){return new Promise((resolve,reject)=>{const im=new Image();im.crossOrigin="anonymous";im.onload=()=>resolve(im);im.onerror=()=>reject(new Error("이미지를 불러오지 못했습니다. CORS 설정을 확인하세요."));im.src=url})}

$("renderAllBtn").onclick=renderAll;
["fontFamily","coverOverlay","navyColor","orangeColor","ivoryColor","whiteColor"].forEach(id=>$(id).addEventListener("input",renderAll));

function renderAll(){
 if(!state.plan)return;
 const grid=$("previewGrid");grid.innerHTML="";
 state.plan.pages.forEach((p,i)=>{
  const box=document.createElement("div");box.className="preview-card";
  box.innerHTML=`<h4><span>${i+1}장 · ${ROLE_LABELS[p.layoutType]||p.layoutType}</span><span>${p.imageNeeded?"이미지형":"정보형"}</span></h4>
   <canvas id="canvas-${i}" width="1080" height="1350"></canvas>
   <div class="preview-actions"><button class="btn-soft edit-scroll">기획 수정 위치</button><button class="btn-green download-one">PNG 저장</button></div>`;
  grid.appendChild(box);
  const cv=box.querySelector("canvas");state.canvases[i]=cv;
  box.querySelector(".download-one").onclick=()=>downloadCanvas(cv,`inwave-card-${i+1}.png`);
  box.querySelector(".edit-scroll").onclick=()=>document.querySelector(`.plan-card[data-index="${i}"]`)?.scrollIntoView({behavior:"smooth",block:"center"});
  drawPage(cv,p,i);
 });
 state.rendered=true;$("downloadZipBtn").disabled=false;
}

function renderPage(i){const cv=state.canvases[i];if(cv&&state.plan?.pages[i])drawPage(cv,state.plan.pages[i],i)}
function rounded(ctx,x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function wrap(ctx,text,maxWidth,maxLines=10){const chars=(text||"").replace(/\s+/g," ").trim();const lines=[];let line="";for(const ch of chars){const test=line+ch;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line.trim());line=ch;if(lines.length===maxLines-1)break}else line=test}if(line&&lines.length<maxLines)lines.push(line.trim());return lines}
function textLines(ctx,lines,x,y,lineHeight,align="left"){ctx.textAlign=align;for(const line of lines){ctx.fillText(line,x,y);y+=lineHeight}return y}
function titleBlock(ctx,p,c,dark=false){
 const x=82,y=88,w=916;
 if(p.showLabel&&p.label){ctx.font=`800 34px ${font()}`;ctx.fillStyle=c.orange;ctx.textAlign="left";ctx.fillText(p.label,x,y)}
 ctx.font=`900 68px ${font()}`;ctx.fillStyle=dark?c.white:c.navy;const title=wrap(ctx,p.title,w,4);let cy=y+(p.showLabel&&p.label?72:10);cy=textLines(ctx,title,x,cy,82);
 if(p.body){ctx.font=`500 31px ${font()}`;ctx.fillStyle=dark?"#f3eee4":"#4a5568";cy+=26;textLines(ctx,wrap(ctx,p.body,w,5),x,cy,46)}
 return cy;
}
function footer(ctx,c,page){ctx.font=`700 20px ${font()}`;ctx.fillStyle=c.navy;ctx.textAlign="left";ctx.fillText("INWAVE",70,1290);ctx.textAlign="right";ctx.fillText(String(page).padStart(2,"0"),1010,1290)}

function drawPage(canvas,p,index){
 const ctx=canvas.getContext("2d"),c=colors(),data=safeJson(p.dataJson,{});
 ctx.clearRect(0,0,1080,1350);ctx.lineJoin="round";
 if(p.layoutType==="cover") return drawCover(ctx,p,index,c);
 ctx.fillStyle=c.ivory;ctx.fillRect(0,0,1080,1350);
 if(p.layoutType==="explain") drawExplain(ctx,p,c);
 else if(p.layoutType==="compare") drawCompare(ctx,p,data,c);
 else if(p.layoutType==="number") drawNumber(ctx,p,data,c);
 else if(p.layoutType==="table") drawTable(ctx,p,data,c);
 else if(p.layoutType==="bar-chart") drawBar(ctx,p,data,c);
 else if(p.layoutType==="line-chart") drawLine(ctx,p,data,c);
 else if(p.layoutType==="process") drawProcess(ctx,p,data,c);
 else if(p.layoutType==="checklist") drawChecklist(ctx,p,data,c);
 else if(p.layoutType==="quote-insight") drawQuote(ctx,p,c);
 else if(p.layoutType==="solution") drawSolution(ctx,p,data,c);
 else drawCta(ctx,p,c);
 footer(ctx,c,index+1);
}
function drawCover(ctx,p,index,c){
 const im=state.images[index];
 if(im){const r=Math.max(1080/im.width,1350/im.height),w=im.width*r,h=im.height*r;ctx.drawImage(im,(1080-w)/2,(1350-h)/2,w,h)}
 else{const g=ctx.createLinearGradient(0,0,1080,1350);g.addColorStop(0,"#32445f");g.addColorStop(.55,"#17243d");g.addColorStop(1,"#0b101c");ctx.fillStyle=g;ctx.fillRect(0,0,1080,1350);ctx.fillStyle="rgba(245,130,32,.22)";ctx.fillRect(690,150,260,800)}
 const ov=Number($("coverOverlay").value)/100;const g=ctx.createLinearGradient(0,0,0,1350);g.addColorStop(0,`rgba(5,10,18,${ov*.65})`);g.addColorStop(.55,`rgba(5,10,18,${ov*.32})`);g.addColorStop(1,`rgba(5,10,18,${Math.min(.92,ov+.25)})`);ctx.fillStyle=g;ctx.fillRect(0,0,1080,1350);
 titleBlock(ctx,p,c,true);ctx.font=`700 20px ${font()}`;ctx.fillStyle="#fff";ctx.fillText("INWAVE",82,1275);ctx.textAlign="right";ctx.fillText(String(index+1).padStart(2,"0"),1000,1275)
}
function drawExplain(ctx,p,c){titleBlock(ctx,p,c);rounded(ctx,82,630,916,430,34,c.white);ctx.fillStyle=c.orange;ctx.fillRect(82,630,14,430);ctx.font=`900 90px ${font()}`;ctx.fillStyle=c.navy;ctx.fillText("WHY",145,720);ctx.font=`600 36px ${font()}`;ctx.fillStyle="#4a5568";textLines(ctx,wrap(ctx,p.body||p.title,760,6),145,850,55)}
function drawCompare(ctx,p,d,c){titleBlock(ctx,p,c);const left={title:d.leftTitle||"A",desc:d.leftDescription||""},right={title:d.rightTitle||"B",desc:d.rightDescription||""};rounded(ctx,70,560,430,540,34,c.white);rounded(ctx,580,560,430,540,34,c.navy);ctx.font=`900 47px ${font()}`;ctx.fillStyle=c.orange;ctx.fillText(left.title,115,650);ctx.fillStyle=c.white;ctx.fillText(right.title,625,650);ctx.font=`600 31px ${font()}`;ctx.fillStyle="#445066";textLines(ctx,wrap(ctx,left.desc,330,6),115,760,48);ctx.fillStyle="#e9edf5";textLines(ctx,wrap(ctx,right.desc,330,6),625,760,48);ctx.font=`900 54px ${font()}`;ctx.fillStyle=c.orange;ctx.textAlign="center";ctx.fillText("≠",540,800);ctx.textAlign="left"}
function drawNumber(ctx,p,d,c){titleBlock(ctx,p,c);const value=d.value??d.number??"00",unit=d.unit||"";rounded(ctx,82,600,916,430,38,c.navy);ctx.textAlign="center";ctx.font=`900 210px ${font()}`;ctx.fillStyle=c.orange;ctx.fillText(String(value),540,690);ctx.font=`800 48px ${font()}`;ctx.fillStyle=c.white;ctx.fillText(unit,540,930);ctx.textAlign="left"}
function drawTable(ctx,p,d,c){titleBlock(ctx,p,c);const headers=d.headers||["구분","기존 방식","측정 방식"],rows=d.rows||[["송출","확인","확인"],["실제 시청","어려움","가능"],["시청시간","어려움","가능"]];const x=70,y=560,w=940,rowH=105,colW=w/headers.length;rounded(ctx,x,y,w,rowH*(rows.length+1),28,c.white);headers.forEach((h,j)=>{ctx.fillStyle=c.navy;ctx.fillRect(x+j*colW,y,colW,rowH);ctx.font=`800 28px ${font()}`;ctx.fillStyle=c.white;ctx.textAlign="center";ctx.fillText(h,x+j*colW+colW/2,y+34)});rows.forEach((r,i)=>r.forEach((v,j)=>{ctx.font=`700 27px ${font()}`;ctx.fillStyle=j===0?c.navy:"#4a5568";ctx.textAlign="center";ctx.fillText(String(v),x+j*colW+colW/2,y+rowH*(i+1)+36)}));ctx.textAlign="left"}
function drawBar(ctx,p,d,c){titleBlock(ctx,p,c);const items=d.items||[];const max=Math.max(...items.map(x=>Number(x.value)||0),1);const x=105,y=620,barMax=700;items.slice(0,6).forEach((it,i)=>{const yy=y+i*100;ctx.font=`700 29px ${font()}`;ctx.fillStyle=c.navy;ctx.textAlign="left";ctx.fillText(it.label,x,yy);rounded(ctx,300,yy-15,barMax,45,22,"#e4ded4");rounded(ctx,300,yy-15,barMax*(Number(it.value)||0)/max,45,22,c.orange);ctx.textAlign="right";ctx.fillText(`${it.value}${d.unit||""}`,1000,yy)});ctx.textAlign="left"}
function drawLine(ctx,p,d,c){titleBlock(ctx,p,c);const items=d.items||[];const x=120,y=620,w=830,h=390,max=Math.max(...items.map(v=>Number(v.value)||0),1);ctx.strokeStyle="#c9c3b8";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y+h);ctx.lineTo(x+w,y+h);ctx.stroke();if(items.length){ctx.strokeStyle=c.orange;ctx.lineWidth=12;ctx.beginPath();items.forEach((it,i)=>{const px=x+(w/(Math.max(1,items.length-1)))*i,py=y+h-(Number(it.value)||0)/max*h*.85;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)});ctx.stroke();items.forEach((it,i)=>{const px=x+(w/(Math.max(1,items.length-1)))*i,py=y+h-(Number(it.value)||0)/max*h*.85;ctx.fillStyle=c.navy;ctx.beginPath();ctx.arc(px,py,14,0,Math.PI*2);ctx.fill();ctx.font=`700 24px ${font()}`;ctx.textAlign="center";ctx.fillText(it.label,px,y+h+35);ctx.fillText(`${it.value}${d.unit||""}`,px,py-45)})}ctx.textAlign="left"}
function drawProcess(ctx,p,d,c){titleBlock(ctx,p,c);const items=d.items||d.steps||["문제 확인","데이터 측정","성과 비교","운영 개선"];items.slice(0,5).forEach((it,i)=>{const y=590+i*125;ctx.fillStyle=c.orange;ctx.beginPath();ctx.arc(125,y,37,0,Math.PI*2);ctx.fill();ctx.font=`900 25px ${font()}`;ctx.fillStyle=c.white;ctx.textAlign="center";ctx.fillText(String(i+1),125,y-16);rounded(ctx,190,y-55,790,105,26,c.white);ctx.font=`800 31px ${font()}`;ctx.fillStyle=c.navy;ctx.textAlign="left";ctx.fillText(typeof it==="string"?it:it.title||"",235,y-18)});ctx.textAlign="left"}
function drawChecklist(ctx,p,d,c){titleBlock(ctx,p,c);const items=d.items||[];items.slice(0,5).forEach((it,i)=>{const y=590+i*120;rounded(ctx,82,y-50,916,92,24,c.white);ctx.fillStyle=c.orange;ctx.beginPath();ctx.arc(135,y-4,24,0,Math.PI*2);ctx.fill();ctx.font=`900 24px ${font()}`;ctx.fillStyle=c.white;ctx.textAlign="center";ctx.fillText("✓",135,y-20);ctx.font=`800 31px ${font()}`;ctx.fillStyle=c.navy;ctx.textAlign="left";ctx.fillText(typeof it==="string"?it:it.title||"",190,y-22)});ctx.textAlign="left"}
function drawQuote(ctx,p,c){ctx.fillStyle=c.navy;ctx.fillRect(0,0,1080,1350);ctx.font=`900 170px Georgia`;ctx.fillStyle=c.orange;ctx.fillText("“",80,180);ctx.font=`900 73px ${font()}`;ctx.fillStyle=c.white;textLines(ctx,wrap(ctx,p.title,850,7),115,370,96);ctx.font=`500 31px ${font()}`;ctx.fillStyle="#e8e2d7";textLines(ctx,wrap(ctx,p.body,850,5),115,940,48)}
function drawSolution(ctx,p,d,c){titleBlock(ctx,p,c);const items=d.metrics||d.items||["실제 시청자 수","평균 시청시간","시간대별 관심도","소재별 성과"];items.slice(0,4).forEach((it,i)=>{const col=i%2,row=Math.floor(i/2),x=82+col*470,y=625+row*225;rounded(ctx,x,y,430,185,28,col===0?c.navy:c.white);ctx.font=`900 33px ${font()}`;ctx.fillStyle=col===0?c.white:c.navy;textLines(ctx,wrap(ctx,typeof it==="string"?it:it.title||"",340,3),x+42,y+50,45);ctx.fillStyle=c.orange;ctx.fillRect(x+42,y+135,85,8)})}
function drawCta(ctx,p,c){ctx.fillStyle=c.navy;ctx.fillRect(0,0,1080,1350);ctx.fillStyle=c.orange;ctx.fillRect(82,120,115,12);ctx.font=`900 72px ${font()}`;ctx.fillStyle=c.white;textLines(ctx,wrap(ctx,p.title,850,6),82,250,92);ctx.font=`500 34px ${font()}`;ctx.fillStyle="#e8e2d7";textLines(ctx,wrap(ctx,p.body,850,6),82,850,52);ctx.font=`800 25px ${font()}`;ctx.fillStyle=c.orange;ctx.fillText("INWAVE · AD MEASUREMENT",82,1240)}

function downloadCanvas(canvas,name){const a=document.createElement("a");a.href=canvas.toDataURL("image/png");a.download=name;a.click()}
$("downloadZipBtn").onclick=async()=>{if(!state.rendered)return;const zip=new JSZip();for(const [i,cv] of Object.entries(state.canvases)){const blob=await new Promise(r=>cv.toBlob(r,"image/png"));zip.file(`inwave-card-${Number(i)+1}.png`,blob)}const file=await zip.generateAsync({type:"blob"});const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download="inwave-cardnews.zip";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script>
