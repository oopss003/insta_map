<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>INWAVE 콘텐츠 스튜디오 4.0</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Nanum+Gothic:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap');
*{box-sizing:border-box} :root{--navy:#17243d;--navy2:#263957;--orange:#f58220;--ivory:#f5f1e8;--green:#176b3a;--red:#b42318;--line:#e6e8ec;--muted:#667085}
body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:var(--ivory);color:var(--navy)}
header{background:var(--navy);color:#fff;padding:20px 28px}.header-inner{max-width:1500px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:22px}.header-copy h1{margin:0;font-size:24px}.header-copy p{margin:7px 0 0;color:#d9d4c8;font-size:14px}.badge{display:inline-block;background:var(--green);font-size:12px;padding:4px 8px;border-radius:5px;margin-left:8px;vertical-align:middle}.new-btn{border:0;border-radius:10px;padding:13px 20px;background:var(--orange);color:white;font-weight:800;cursor:pointer;white-space:nowrap}
main{width:min(1500px,calc(100% - 28px));margin:26px auto;display:grid;grid-template-columns:minmax(0,1fr) 500px;gap:22px;align-items:start}.panel{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 24px rgba(0,0,0,.08)}.preview{position:sticky;top:18px}h2{font-size:21px;margin:0 0 15px}h3{font-size:17px;margin:22px 0 10px}.divider{border:0;border-top:1px solid var(--line);margin:24px 0}
label{display:block;font-size:14px;font-weight:800;margin:0 0 6px}input[type=text],textarea,select{width:100%;border:1px solid #d7dbe2;border-radius:10px;padding:12px;font:inherit;color:var(--navy);background:#fff;outline:none}textarea{resize:vertical;line-height:1.55}input:focus,textarea:focus,select:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(245,130,32,.12)}
.chat{height:370px;border:1px solid var(--line);border-radius:13px;overflow:hidden;display:flex;flex-direction:column}.messages{flex:1;padding:15px;overflow:auto;display:flex;flex-direction:column;gap:10px;background:#fdfdfd}.msg{max-width:86%;padding:11px 14px;border-radius:14px;line-height:1.5;font-size:14px;white-space:pre-wrap;word-break:keep-all}.msg.user{align-self:flex-end;background:var(--orange);color:white;border-bottom-right-radius:4px}.msg.ai{align-self:flex-start;background:#eef1f5;border-bottom-left-radius:4px}.chat-entry{display:flex;gap:8px;padding:11px;border-top:1px solid var(--line)}.chat-entry input{flex:1}.chat-entry button{border:0;border-radius:8px;background:var(--navy);color:#fff;font-weight:800;padding:0 18px;cursor:pointer}
#workspace{display:none}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:15px}.tab{border:0;border-radius:8px;padding:10px 16px;background:#eef1f5;color:var(--muted);font-weight:800;cursor:pointer;white-space:nowrap}.tab.active{background:var(--navy);color:#fff}.field{margin-bottom:14px}.prompt-summary{font-size:13px;color:var(--orange);font-weight:800;margin-bottom:6px}.source-box{border:1px solid var(--line);border-radius:11px;padding:11px;background:#fafafa;font-size:13px;line-height:1.5}.source-item{padding:7px 0;border-bottom:1px dashed #ddd}.source-item:last-child{border-bottom:0}.source-item a{color:#2457a7;word-break:break-all}
.concepts,.providers,.two-col,.three-col,.caption-tabs,.downloads{display:grid;gap:10px}.concepts{grid-template-columns:repeat(3,1fr)}.concept{border:2px solid transparent;border-radius:12px;padding:13px;background:#f3f4f6;text-align:left;color:var(--navy);cursor:pointer}.concept.active{border-color:var(--orange);background:#fff4e8}.concept strong{display:block;margin-bottom:5px}.providers{margin-top:12px}.provider{display:grid;grid-template-columns:1fr 110px;align-items:center;gap:12px;border:1px solid var(--line);border-radius:11px;padding:12px;background:#fafafa}.provider span{font-size:13px;color:var(--muted)}
.btn{width:100%;border:0;border-radius:10px;padding:13px 16px;font-weight:800;font-size:15px;cursor:pointer;margin-top:11px}.btn:disabled{opacity:.55;cursor:not-allowed}.orange{background:var(--orange);color:white}.navy{background:var(--navy);color:white}.green{background:var(--green);color:white}.light{background:#eef1f5;color:var(--navy)}.two-col{grid-template-columns:1fr 1fr}.three-col{grid-template-columns:repeat(3,1fr)}
.gallery{display:none;margin-top:18px}.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.gallery-item{border:3px solid transparent;border-radius:10px;overflow:hidden;cursor:pointer}.gallery-item.selected{border-color:var(--orange)}.gallery-item img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.canvas-wrap{background:#111;border-radius:15px;overflow:hidden;aspect-ratio:4/5}canvas{width:100%;height:auto;display:block;touch-action:none;cursor:grab}.controls{margin-top:13px;padding:13px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.control-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.control-grid input[type=range]{width:100%}.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:11px}.colors input{width:100%;height:42px;border:1px solid var(--line);border-radius:7px}.colors small{display:block;text-align:center;color:var(--muted);margin-top:3px}.align-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px}.mini{border:0;border-radius:8px;padding:9px;background:#e9edf2;color:var(--navy);font-weight:800;cursor:pointer}.mini.active{background:var(--orange);color:#fff}
.status{display:none;margin-top:13px;border-radius:10px;padding:11px;background:#eef1f5;font-size:14px;white-space:pre-wrap;line-height:1.45}.status.show{display:block}.status.success{background:#e8f6ee;color:var(--green)}.status.error{background:#fff0f0;color:var(--red)}
.post-section{margin-top:25px;border-top:2px dashed var(--line);padding-top:22px}.caption-tabs{grid-template-columns:repeat(3,1fr);margin-bottom:10px}.caption-tab{border:0;border-radius:8px;padding:9px;background:#eef1f5;color:var(--navy);font-weight:800;cursor:pointer}.caption-tab.active{background:var(--navy);color:#fff}.copy-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:10px}
@media(max-width:1100px){main{grid-template-columns:1fr}.preview{position:static}}@media(max-width:720px){.header-inner{display:block}.new-btn{width:100%;margin-top:14px}.concepts,.two-col,.three-col,.caption-tabs,.copy-row,.control-grid,.gallery-grid{grid-template-columns:1fr}.provider{grid-template-columns:1fr}.preview{padding:14px}}
</style>
</head>
<body>
<header><div class="header-inner"><div class="header-copy"><h1>INWAVE 콘텐츠 스튜디오 4.0 <span class="badge">기획·검색·제작·게시</span></h1><p>광고 인사이트 카드뉴스를 조사부터 캡션과 개별 PNG 저장까지 한 번에 완성합니다.</p></div><button class="new-btn" id="resetButton">새로 만들기</button></div></header>
<main>
<section class="panel">
<h2>1. 기획 방향성 대화</h2>
<div class="chat"><div class="messages" id="messages"></div><div class="chat-entry"><input id="chatInput" type="text" placeholder="예: 최근 리테일 미디어 트렌드를 조사해서 광고주용 카드뉴스로 만들어줘"/><button id="sendButton">전송</button></div></div>
<div class="status" id="status"></div>
<div id="workspace">
<hr class="divider"/><h2>2. 스토리보드 편집</h2><div class="tabs" id="tabs"></div>
<div class="field"><label>장표 역할 라벨</label><input id="pageLabel" type="text"/></div>
<div class="field"><label>장표 제목</label><textarea id="pageTitle" rows="2"></textarea></div>
<div class="field"><label>장표 본문</label><textarea id="pageBody" rows="3"></textarea></div>
<div class="field"><label>이미지 프롬프트</label><div class="prompt-summary" id="promptSummary"></div><textarea id="pagePrompt" rows="7"></textarea></div>
<div class="field"><label>검색 출처</label><div class="source-box" id="sourceBox">이 장표에 연결된 출처가 없습니다.</div></div>
<h3>3. 이미지 생성</h3>
<div class="concepts"><button class="concept active" data-concept="hook"><strong>강한 후킹형</strong>피드에서 즉시 멈추는 구성</button><button class="concept" data-concept="insight"><strong>전문 인사이트형</strong>신뢰감 있는 분석 톤</button><button class="concept" data-concept="magazine"><strong>트렌드 매거진형</strong>세련된 에디토리얼 톤</button></div>
<div class="providers"><div class="provider"><div><strong>FAL API</strong><br/><span>고품질 이미지 생성</span></div><select id="falCount"><option value="0">0장</option><option value="1">1장</option><option value="2" selected>2장</option></select></div><div class="provider"><div><strong>Replicate API</strong><br/><span>추가 이미지 후보 생성</span></div><select id="replicateCount"><option value="0" selected>0장</option><option value="1">1장</option><option value="2">2장</option></select></div></div>
<button class="btn orange" id="generateButton">현재 장표 이미지 생성</button>
<div class="gallery" id="gallery"><label>생성된 이미지 후보</label><div class="gallery-grid" id="galleryGrid"></div></div>
<div class="post-section"><h2>5. 인스타그램 게시글</h2><div class="caption-tabs"><button class="caption-tab active" data-caption="short">짧고 강하게</button><button class="caption-tab" data-caption="informative">정보형</button><button class="caption-tab" data-caption="conversational">대화형</button></div><div class="field"><label>캡션</label><textarea id="captionText" rows="7"></textarea></div><div class="field"><label>행동 유도 문구(CTA)</label><textarea id="ctaText" rows="2"></textarea></div><div class="field"><label>해시태그</label><textarea id="hashtagsText" rows="4"></textarea></div><div class="copy-row"><button class="btn light" id="copyCaption">캡션 복사</button><button class="btn light" id="copyHashtags">해시태그 복사</button><button class="btn navy" id="copyAll">전체 복사</button></div></div>
</div>
</section>
<section class="panel preview"><h2>4. 디자인 미리보기 및 저장</h2><div class="canvas-wrap"><canvas id="canvas" width="1080" height="1350"></canvas></div>
<div class="two-col"><button class="btn navy" id="autoLayout" style="display:none">빠른 자동 위치</button><button class="btn navy" id="aiLayout" style="display:none">AI 자동 위치</button></div>
<div class="controls"><div class="control-grid"><div><label>폰트</label><select id="font"><option value='"Noto Sans KR", sans-serif'>Noto Sans KR</option><option value='"Nanum Gothic", sans-serif'>나눔고딕</option><option value='"Black Han Sans", sans-serif'>검은고딕</option><option value='"Do Hyeon", sans-serif'>도현체</option></select></div><div><label>텍스트 폭</label><input id="textWidth" type="range" min="40" max="88" value="70"/></div><div><label>제목 크기</label><input id="titleSize" type="range" min="48" max="100" value="68"/></div><div><label>본문 크기</label><input id="bodySize" type="range" min="22" max="48" value="30"/></div><div><label>배경 어둡기</label><input id="overlay" type="range" min="0" max="100" value="80"/></div></div><div class="colors"><div><input id="labelColor" type="color" value="#f58220"/><small>라벨</small></div><div><input id="titleColor" type="color" value="#ffffff"/><small>제목</small></div><div><input id="bodyColor" type="color" value="#f0f0f0"/><small>본문</small></div></div><div class="align-row"><button class="mini active" data-align="left">왼쪽</button><button class="mini" data-align="center">가운데</button><button class="mini" data-align="right">오른쪽</button></div></div>
<div class="downloads"><button class="btn green" id="downloadCurrent" disabled>현재 장표 PNG 다운로드</button><button class="btn green" id="downloadAll" disabled>전체 장표 개별 다운로드</button></div><div class="note">전체 다운로드 시 브라우저에서 여러 파일 다운로드 허용을 요청할 수 있습니다. 장표마다 약 0.5초 간격으로 저장합니다.</div></section>
</main>
<script>
const DEFAULT_IMAGE="https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=1080&q=80";
const state={messages:[],pages:[],index:0,concept:"hook",projectTitle:"광고인사이트",post:{captions:{short:"",informative:"",conversational:""},cta:"",hashtags:[]},captionStyle:"short",controllers:{chat:null,image:null,layout:null},drag:null,textRect:{x:0,y:0,w:0,h:0}};
const $=id=>document.getElementById(id), canvas=$("canvas"),ctx=canvas.getContext("2d");
function status(text,type=""){const e=$("status");e.textContent=text;e.className="status show"+(type?" "+type:"")}
function clearStatus(){$("status").className="status"}
function loading(btn,on,text,normal){btn.disabled=on;btn.textContent=on?text:normal}
function welcome(){return "안녕하세요. 광고주가 클릭하고 저장할 만한 카드뉴스를 함께 기획합니다.\n주제와 타깃을 적어주세요. 최신 통계나 사례가 필요하면 검색 요청도 함께 적어주세요."}
function append(role,text){const d=document.createElement("div");d.className="msg "+role;d.textContent=text;$("messages").appendChild(d);$("messages").scrollTop=$("messages").scrollHeight;return d}
function abortAll(){Object.values(state.controllers).forEach(c=>c?.abort());state.controllers={chat:null,image:null,layout:null}}
function loadImage(url){return new Promise((resolve,reject)=>{const img=new Image();img.crossOrigin="anonymous";img.onload=()=>resolve(img);img.onerror=()=>reject(new Error("이미지를 불러오지 못했습니다."));img.src=url})}
function layoutFromArea(area){const map={"upper-left":{x:6,y:7,align:"left"},"upper-center":{x:15,y:7,align:"center"},"upper-right":{x:24,y:7,align:"right"},"middle-left":{x:6,y:34,align:"left"},"middle-right":{x:24,y:34,align:"right"},"lower-left":{x:6,y:57,align:"left"},"lower-center":{x:15,y:57,align:"center"},"lower-right":{x:24,y:57,align:"right"}};return map[area]||map["lower-left"]}
function roleSizes(role){if(role==="hook")return{title:76,body:29};if(role==="cta")return{title:68,body:29};return{title:62,body:29}}
function reset(force=false){if(!force&&(state.pages.length||state.messages.length)&&!confirm("현재 작업을 초기화하고 새로 시작할까요?"))return;abortAll();state.messages=[];state.pages=[];state.index=0;state.concept="hook";state.projectTitle="광고인사이트";state.post={captions:{short:"",informative:"",conversational:""},cta:"",hashtags:[]};state.captionStyle="short";$("messages").innerHTML="";append("ai",welcome());$("workspace").style.display="none";$("tabs").innerHTML="";$("gallery").style.display="none";$("galleryGrid").innerHTML="";$("autoLayout").style.display="none";$("aiLayout").style.display="none";$("downloadCurrent").disabled=true;$("downloadAll").disabled=true;$("chatInput").value="";clearStatus();drawEmpty()}
function drawEmpty(){ctx.fillStyle="#1b2435";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle="rgba(255,255,255,.9)";ctx.textAlign="center";ctx.font='800 42px "Noto Sans KR"';ctx.fillText("미리보기 영역",540,645);ctx.fillStyle="rgba(255,255,255,.65)";ctx.font='500 24px "Noto Sans KR"';ctx.fillText("스토리보드와 이미지를 생성하면 이곳에 표시됩니다.",540,700);ctx.textAlign="left"}
async function send(){const text=$("chatInput").value.trim();if(!text||state.controllers.chat)return;append("user",text);state.messages.push({role:"user",content:text});$("chatInput").value="";const temp=append("ai",/최신|최근|검색|조사|통계|출처|근거|트렌드|논문/.test(text)?"최신 자료를 확인하고 카드뉴스를 기획하고 있습니다...":"카드뉴스 흐름과 문장을 기획하고 있습니다...");const c=new AbortController();state.controllers.chat=c;loading($("sendButton"),true,"처리 중...","전송");try{const r=await fetch("/api/plan-carousel",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:state.messages}),signal:c.signal});const raw=await r.text();let d;try{d=JSON.parse(raw)}catch{throw new Error(`서버 응답을 JSON으로 읽지 못했습니다. HTTP ${r.status}`)}temp.remove();if(!r.ok)throw new Error(d.error||`기획 요청 실패 (HTTP ${r.status})`);const reply=typeof d.chatReply==="string"&&d.chatReply.trim()?d.chatReply.trim():(d.isComplete?"카드뉴스 기획이 완료되었습니다.":"추가 정보가 필요합니다. 핵심 주제나 타깃을 한 번 더 알려주세요.");append("ai",reply);state.messages.push({role:"assistant",content:reply});if(d.isComplete){await initStoryboard(d);status(d.searchUsed?"웹 검색 근거를 포함한 스토리보드가 완성되었습니다.":"스토리보드가 완성되었습니다.","success")}else status("추가 질문에 답하면 이어서 완성합니다.")}catch(e){temp.remove();if(e.name!=="AbortError"){append("ai","오류: "+e.message);status(e.message,"error")}}finally{state.controllers.chat=null;loading($("sendButton"),false,"","전송")}}
async function initStoryboard(data){const img=await loadImage(DEFAULT_IMAGE);state.projectTitle=data.projectTitle||"광고인사이트";state.post=data.instagramPost||state.post;state.pages=data.storyboard.pages.map((p,i)=>{const pos=layoutFromArea(p.imageComposition?.reservedTextArea),sizes=roleSizes(p.role);return{...p,id:i,candidates:[],imageUrl:DEFAULT_IMAGE,image:img,layout:{x:pos.x,y:pos.y,width:70,align:pos.align,titleSize:sizes.title,bodySize:sizes.body,font:'"Noto Sans KR", sans-serif',labelColor:"#f58220",titleColor:"#ffffff",bodyColor:"#f0f0f0",overlay:.8}}});$("workspace").style.display="block";$("autoLayout").style.display="block";$("aiLayout").style.display="block";$("downloadCurrent").disabled=false;$("downloadAll").disabled=false;renderTabs();selectPage(0);renderPost()}
function renderTabs(){$("tabs").innerHTML="";state.pages.forEach((p,i)=>{const b=document.createElement("button");b.className="tab"+(i===state.index?" active":"");b.textContent=`${i+1}장 · ${p.role}`;b.onclick=()=>selectPage(i);$("tabs").appendChild(b)})}
function selectPage(i){state.index=i;renderTabs();const p=state.pages[i];if(!p)return;$("pageLabel").value=p.label;$("pageTitle").value=p.title;$("pageBody").value=p.body;$("pagePrompt").value=p.englishImagePrompt;$("promptSummary").textContent=`[장면] ${p.koreanPromptSummary} / 예약 영역: ${p.imageComposition?.reservedTextArea||"lower-left"}`;renderSources(p.sources);renderGallery();syncControls();draw()}
function renderSources(sources=[]){const box=$("sourceBox");if(!sources.length){box.textContent="이 장표에 연결된 출처가 없습니다.";return}box.innerHTML="";sources.forEach(s=>{const d=document.createElement("div");d.className="source-item";const title=document.createElement("strong");title.textContent=`${s.sourceOrganization||"출처"} · ${s.sourceYear||""} · ${s.sourceTitle||"자료"}`;d.appendChild(title);d.appendChild(document.createElement("br"));const note=document.createTextNode(s.sourceNote||"");d.appendChild(note);if(s.sourceUrl){d.appendChild(document.createElement("br"));const a=document.createElement("a");a.href=s.sourceUrl;a.target="_blank";a.rel="noopener noreferrer";a.textContent=s.sourceUrl;d.appendChild(a)}box.appendChild(d)})}
function syncControls(){const l=state.pages[state.index].layout;$("font").value=l.font;$("textWidth").value=l.width;$("titleSize").value=l.titleSize;$("bodySize").value=l.bodySize;$("overlay").value=l.overlay*100;$("labelColor").value=l.labelColor;$("titleColor").value=l.titleColor;$("bodyColor").value=l.bodyColor;document.querySelectorAll("[data-align]").forEach(b=>b.classList.toggle("active",b.dataset.align===l.align))}
function updateText(key,value){const p=state.pages[state.index];p[key]=value;if(key==="title")p.titleLines=[];if(key==="body")p.bodyLines=[];draw()}
$("pageLabel").oninput=e=>updateText("label",e.target.value);$("pageTitle").oninput=e=>updateText("title",e.target.value);$("pageBody").oninput=e=>updateText("body",e.target.value);$("pagePrompt").oninput=e=>state.pages[state.index].englishImagePrompt=e.target.value;
function updateLayout(key,value){state.pages[state.index].layout[key]=value;draw()}
$("font").onchange=e=>updateLayout("font",e.target.value);$("textWidth").oninput=e=>updateLayout("width",+e.target.value);$("titleSize").oninput=e=>updateLayout("titleSize",+e.target.value);$("bodySize").oninput=e=>updateLayout("bodySize",+e.target.value);$("overlay").oninput=e=>updateLayout("overlay",+e.target.value/100);$("labelColor").oninput=e=>updateLayout("labelColor",e.target.value);$("titleColor").oninput=e=>updateLayout("titleColor",e.target.value);$("bodyColor").oninput=e=>updateLayout("bodyColor",e.target.value);
document.querySelectorAll("[data-align]").forEach(b=>b.onclick=()=>{updateLayout("align",b.dataset.align);syncControls()});document.querySelectorAll(".concept").forEach(b=>b.onclick=()=>{state.concept=b.dataset.concept;document.querySelectorAll(".concept").forEach(x=>x.classList.toggle("active",x===b));draw()});
function cover(context,img){const ir=img.width/img.height,cr=canvas.width/canvas.height;let w,h,x,y;if(ir>cr){h=canvas.height;w=img.width*(h/img.height);x=(canvas.width-w)/2;y=0}else{w=canvas.width;h=img.height*(w/img.width);x=0;y=(canvas.height-h)/2}context.drawImage(img,x,y,w,h)}
function tokenize(text){return String(text||"").replace(/\r/g,"").split(/(\n|\s+|(?<=[,.!?。？！]))/).filter(Boolean)}
function wrap(ctx2,text,maxWidth,maxLines){if(!text)return[];const manual=String(text).split("\n");if(manual.length>1)return manual.map(x=>x.trim()).filter(Boolean).slice(0,maxLines);const tokens=tokenize(text);const lines=[];let line="";for(const token of tokens){if(token==="\n"){if(line.trim())lines.push(line.trim());line="";continue}const test=(line+token).replace(/^\s+/,"");if(ctx2.measureText(test).width<=maxWidth||!line){line=test}else{lines.push(line.trim());line=token.trimStart()}if(lines.length===maxLines-1)break}if(line.trim()&&lines.length<maxLines)lines.push(line.trim());return lines.slice(0,maxLines)}
function getLines(p,type,ctx2,maxWidth,maxLines){const fixed=type==="title"?p.titleLines:p.bodyLines;if(Array.isArray(fixed)&&fixed.length)return fixed.slice(0,maxLines);return wrap(ctx2,p[type],maxWidth,maxLines)}
function gradient(context,l){const g=context.createLinearGradient(0,canvas.height,0,0);const base=state.concept==="insight"?"14,31,55":state.concept==="magazine"?"8,8,8":"0,0,0";g.addColorStop(0,`rgba(${base},${.96*l.overlay})`);g.addColorStop(.38,`rgba(${base},${.52*l.overlay})`);g.addColorStop(.75,`rgba(${base},${.05*l.overlay})`);return g}
function draw(backgroundOnly=false,target=ctx){const p=state.pages[state.index];if(!p){drawEmpty();return}const l=p.layout;target.clearRect(0,0,canvas.width,canvas.height);p.image?cover(target,p.image):(target.fillStyle="#1b2435",target.fillRect(0,0,canvas.width,canvas.height));target.fillStyle=gradient(target,l);target.fillRect(0,0,canvas.width,canvas.height);if(backgroundOnly)return;const x=l.x/100*canvas.width,startY=l.y/100*canvas.height,maxW=l.width/100*canvas.width,anchor=l.align==="center"?x+maxW/2:l.align==="right"?x+maxW:x;let y=startY;target.textAlign=l.align;target.textBaseline="top";target.shadowColor="rgba(0,0,0,.55)";target.shadowBlur=13;target.shadowOffsetY=4;if(p.label){target.fillStyle=l.labelColor;target.font=`800 36px ${l.font}`;target.fillText(p.label,anchor,y);y+=59}target.fillStyle=l.titleColor;target.font=`800 ${l.titleSize}px ${l.font}`;const tl=getLines(p,"title",target,maxW,3);tl.forEach(line=>{target.fillText(line,anchor,y);y+=l.titleSize*1.13});if(p.body){y+=17;target.fillStyle=l.bodyColor;target.font=`500 ${l.bodySize}px ${l.font}`;const bl=getLines(p,"body",target,maxW,4);bl.forEach(line=>{target.fillText(line,anchor,y);y+=l.bodySize*1.4})}target.shadowColor="transparent";state.textRect={x,startY,w:maxW,h:y-startY}}
function renderGallery(){const p=state.pages[state.index],grid=$("galleryGrid");grid.innerHTML="";if(!p.candidates?.length){$("gallery").style.display="none";return}p.candidates.forEach(c=>{const d=document.createElement("div");d.className="gallery-item"+(c.imageUrl===p.imageUrl?" selected":"");const im=document.createElement("img");im.src=c.imageUrl;d.appendChild(im);d.onclick=async()=>{await applyImage(c.imageUrl);renderGallery()};grid.appendChild(d)});$("gallery").style.display="block"}
async function generate(){const p=state.pages[state.index];if(!p?.englishImagePrompt)return status("이미지 프롬프트가 없습니다.","error");const providers={fal:+$("falCount").value,replicate:+$("replicateCount").value};if(providers.fal+providers.replicate<1)return status("이미지 생성 장수를 1장 이상 선택하세요.","error");const c=new AbortController();state.controllers.image=c;loading($("generateButton"),true,"이미지 생성 중...","현재 장표 이미지 생성");status("장표별 구도와 텍스트 예약 영역을 반영해 이미지를 생성하고 있습니다.");try{const r=await fetch("/api/generate-images",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:p.englishImagePrompt,concept:state.concept,providers,imageComposition:p.imageComposition,role:p.role}),signal:c.signal});const d=await r.json();if(!r.ok)throw new Error(d.error||(d.providerErrors||[]).map(x=>x.message).join(", "));p.candidates=d.images||[];if(!p.candidates.length)throw new Error("생성된 이미지가 없습니다.");await applyImage(p.candidates[0].imageUrl);renderGallery();status("이미지가 생성되었고 빠른 자동 위치를 적용했습니다.","success")}catch(e){if(e.name!=="AbortError")status(e.message,"error")}finally{state.controllers.image=null;loading($("generateButton"),false,"","현재 장표 이미지 생성")}}
async function applyImage(url){const p=state.pages[state.index];p.image=await loadImage(url);p.imageUrl=url;draw();setTimeout(()=>autoLayout(false),0)}
function blockHeight(p,l){const oc=document.createElement("canvas").getContext("2d"),w=l.width/100*canvas.width;let h=p.label?59:0;oc.font=`800 ${l.titleSize}px ${l.font}`;h+=getLines(p,"title",oc,w,3).length*l.titleSize*1.13;if(p.body){h+=17;oc.font=`500 ${l.bodySize}px ${l.font}`;h+=getLines(p,"body",oc,w,4).length*l.bodySize*1.4}return h}
function regionStats(context,x,y,w,h){try{const data=context.getImageData(x,y,w,h).data;let sum=0,sq=0,edge=0,n=0,prev=null;for(let py=0;py<h;py+=8)for(let px=0;px<w;px+=8){const i=(py*w+px)*4,lum=.2126*data[i]+.7152*data[i+1]+.0722*data[i+2];sum+=lum;sq+=lum*lum;if(prev!==null)edge+=Math.abs(lum-prev);prev=lum;n++}const avg=sum/n,v=Math.max(0,sq/n-avg*avg);return{avg,v,edge:edge/n}}catch{return{avg:110,v:500,edge:50}}}
function autoLayout(show=true){const p=state.pages[state.index],l=p.layout;if(!p?.image)return;const off=document.createElement("canvas");off.width=canvas.width;off.height=canvas.height;const oc=off.getContext("2d");draw(true,oc);const h=blockHeight(p,l),ys=[6,12,20,30,40,50,58,65],xs=[{x:6,a:"left"},{x:(100-l.width)/2,a:"center"},{x:94-l.width,a:"right"}];let best=null;for(const c of xs)for(const y of ys){const px=Math.round(c.x/100*canvas.width),py=Math.round(y/100*canvas.height),pw=Math.round(l.width/100*canvas.width),ph=Math.round(h);if(py+ph>canvas.height*.95)continue;const s=regionStats(oc,px,py,pw,ph),score=Math.abs(235-s.avg)*.5+(255-Math.min(255,Math.sqrt(s.v)*3))*.28+(255-Math.min(255,s.edge*2.2))*.22+(y>45?8:0);if(!best||score>best.score)best={x:c.x,y,a:c.a,score}}if(best){Object.assign(l,{x:best.x,y:best.y,align:best.a});syncControls();draw();if(show)status("빠른 자동 위치를 적용했습니다.","success")}}
function snapshot(){const off=document.createElement("canvas");off.width=canvas.width;off.height=canvas.height;const oc=off.getContext("2d");draw(true,oc);return off.toDataURL("image/jpeg",.9)}
async function aiLayout(){const p=state.pages[state.index],l=p.layout;if(!p?.image)return;const c=new AbortController();state.controllers.layout=c;loading($("aiLayout"),true,"AI 분석 중...","AI 자동 위치");status("AI가 피사체, 여백, 텍스트 크기와 줄바꿈을 함께 분석하고 있습니다.");try{const r=await fetch("/api/analyze-layout",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({imageDataUrl:snapshot(),page:{role:p.role,label:p.label,title:p.title,body:p.body,titleLines:p.titleLines,bodyLines:p.bodyLines},currentLayout:{...l},canvas:{width:canvas.width,height:canvas.height}}),signal:c.signal});const d=await r.json();if(!r.ok)throw new Error(d.error||"AI 자동 위치 실패");const q=d.recommendedLayout;Object.assign(l,{x:q.x,y:q.y,width:q.width,align:q.align,titleSize:q.titleSize,bodySize:q.bodySize,overlay:q.overlayOpacity});if(q.titleLines?.length)p.titleLines=q.titleLines;if(Array.isArray(q.bodyLines))p.bodyLines=q.bodyLines;syncControls();draw();status("AI 자동 위치를 적용했습니다.\n"+(d.reason||""),"success")}catch(e){if(e.name!=="AbortError")status(e.message,"error")}finally{state.controllers.layout=null;loading($("aiLayout"),false,"","AI 자동 위치")}}
function safeFileName(s){return String(s||"광고인사이트").replace(/[\\/:*?"<>|\s]+/g,"").slice(0,30)||"광고인사이트"}
function downloadPage(i){const old=state.index;state.index=i;draw();const a=document.createElement("a");a.href=canvas.toDataURL("image/png");a.download=`INWAVE_${safeFileName(state.projectTitle)}_${String(i+1).padStart(2,"0")}.png`;document.body.appendChild(a);a.click();a.remove();state.index=old;draw()}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function downloadAll(){loading($("downloadAll"),true,"다운로드 중...","전체 장표 개별 다운로드");status("여러 파일 다운로드 허용 창이 나타나면 허용해 주세요.");for(let i=0;i<state.pages.length;i++){downloadPage(i);await sleep(550)}selectPage(state.index);loading($("downloadAll"),false,"","전체 장표 개별 다운로드");status("전체 장표 다운로드 요청을 완료했습니다.","success")}
function renderPost(){$("captionText").value=state.post.captions?.[state.captionStyle]||"";$("ctaText").value=state.post.cta||"";$("hashtagsText").value=(state.post.hashtags||[]).join(" ");document.querySelectorAll(".caption-tab").forEach(b=>b.classList.toggle("active",b.dataset.caption===state.captionStyle))}
async function copyText(text,msg){try{await navigator.clipboard.writeText(text);status(msg,"success")}catch{const t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();status(msg,"success")}}
$("captionText").oninput=e=>state.post.captions[state.captionStyle]=e.target.value;$("ctaText").oninput=e=>state.post.cta=e.target.value;$("hashtagsText").oninput=e=>state.post.hashtags=e.target.value.split(/\s+/).filter(Boolean);document.querySelectorAll(".caption-tab").forEach(b=>b.onclick=()=>{state.post.captions[state.captionStyle]=$("captionText").value;state.captionStyle=b.dataset.caption;renderPost()});$("copyCaption").onclick=()=>copyText($("captionText").value,"캡션이 복사되었습니다.");$("copyHashtags").onclick=()=>copyText($("hashtagsText").value,"해시태그가 복사되었습니다.");$("copyAll").onclick=()=>copyText([$("captionText").value,$("ctaText").value,$("hashtagsText").value].filter(Boolean).join("\n\n"),"인스타그램 게시글 내용이 복사되었습니다.");
canvas.addEventListener("pointerdown",e=>{if(!state.pages.length)return;const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*canvas.width/r.width,y=(e.clientY-r.top)*canvas.height/r.height,b=state.textRect;if(x>=b.x-20&&x<=b.x+b.w+20&&y>=b.startY-20&&y<=b.startY+b.h+20){const l=state.pages[state.index].layout;state.drag={px:x,py:y,x:l.x,y:l.y};canvas.setPointerCapture(e.pointerId)}});canvas.addEventListener("pointermove",e=>{if(!state.drag)return;const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*canvas.width/r.width,y=(e.clientY-r.top)*canvas.height/r.height,l=state.pages[state.index].layout;l.x=Math.max(0,Math.min(100-l.width,state.drag.x+(x-state.drag.px)/canvas.width*100));l.y=Math.max(0,Math.min(92,state.drag.y+(y-state.drag.py)/canvas.height*100));draw()});["pointerup","pointercancel"].forEach(ev=>canvas.addEventListener(ev,()=>state.drag=null));
$("sendButton").onclick=send;$("chatInput").addEventListener("keydown",e=>{if(e.key==="Enter")send()});$("resetButton").onclick=()=>reset(false);$("generateButton").onclick=generate;$("autoLayout").onclick=()=>autoLayout(true);$("aiLayout").onclick=aiLayout;$("downloadCurrent").onclick=()=>downloadPage(state.index);$("downloadAll").onclick=downloadAll;
(document.fonts?.ready||Promise.resolve()).then(()=>reset(true));
