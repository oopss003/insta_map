function renderSlide(slide) {
  if (slide.type === "cover") return renderCover(slide);
  if (slide.type === "compare") return renderCompare(slide);
  if (slide.type === "solution") return renderSolution(slide);
  if (slide.type === "flow") return renderFlow(slide);
  if (slide.type === "validation") return renderValidation(slide);
  if (slide.type === "operation") return renderOperation(slide);
  if (slide.type === "difference") return renderDifference(slide);
  if (slide.type === "bm") return renderBM(slide);
  if (slide.type === "product") return renderProduct(slide);
  if (slide.type === "usecase") return renderUsecase(slide);
  if (slide.type === "strategy") return renderStrategy(slide);
  if (slide.type === "roadmap") return renderRoadmap(slide);
  if (slide.type === "kpi") return renderKPI(slide);
  if (slide.type === "conclusion") return renderConclusion(slide);
}

function createDeck() {
  const deck = document.getElementById("deck");
  deck.innerHTML = slides.map((slide, index) => `
    <div class="slide-wrap">
      <div class="slide-control">
        <span>${slide.no} / 14 · ${slide.section}</span>
        <button onclick="downloadSlide(${index})">${slide.no} 페이지 PNG 다운로드</button>
      </div>
      <div class="slide">
        <section class="slide-inner" id="slide-${index}">
          ${renderSlide(slide)}
        </section>
      </div>
    </div>
  `).join("");

  resizeSlides();
}

function resizeSlides() {
  document.querySelectorAll(".slide").forEach(box => {
    const inner = box.querySelector(".slide-inner");
    const scale = box.clientWidth / 1920;
    inner.style.transform = `scale(${scale})`;
  });
}

async function downloadSlide(index) {
  const slide = document.getElementById(`slide-${index}`);
  const oldTransform = slide.style.transform;

  slide.style.transform = "scale(1)";

  const canvas = await html2canvas(slide, {
    width: 1920,
    height: 1080,
    scale: 1,
    backgroundColor: "#f7f7f7"
  });

  slide.style.transform = oldTransform;

  const link = document.createElement("a");
  link.download = `inwave_slide_${String(index + 1).padStart(2, "0")}.png`;
  link.href = canvas.toDataURL("image/png");
  link.click();
}

async function downloadAll() {
  for (let i = 0; i < slides.length; i++) {
    await downloadSlide(i);
    await new Promise(resolve => setTimeout(resolve, 400));
  }
}

window.addEventListener("resize", resizeSlides);
window.addEventListener("load", createDeck);
