<script>
  function resizeSlide() {
    const scaleBox = document.getElementById("slideScale");
    const slide = document.getElementById("slide14");
    const scale = scaleBox.clientWidth / 1920;
    slide.style.transform = `scale(${scale})`;
  }

  window.addEventListener("resize", resizeSlide);
  window.addEventListener("load", resizeSlide);

  async function downloadSlide() {
    const slide = document.getElementById("slide14");

    const originalTransform = slide.style.transform;
    slide.style.transform = "scale(1)";

    const canvas = await html2canvas(slide, {
      width: 1920,
      height: 1080,
      scale: 1,
      backgroundColor: "#fbfbfb"
    });

    slide.style.transform = originalTransform;

    const link = document.createElement("a");
    link.download = "inwave_slide_14_conclusion.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  }
</script>
